[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "peykan"
dynamic = ["version"]
description = "Peykan: MCP server exposing vehicle CAN bus, OBD-II and SAE J1939 diagnostics to LLMs, with a built-in virtual CAN simulator (no hardware required)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "farzad", email = "farzadnadiri7@gmail.com" }
]
keywords = [
  "peykan",
  "mcp-can",
  "mcp",
  "model-context-protocol",
  "can-bus",
  "canbus",
  "obd-ii",
  "obd2",
  "j1939",
  "uds",
  "iso-tp",
  "isotp",
  "can-log",
  "blf",
  "asc",
  "automotive",
  "vehicle-diagnostics",
  "ecu",
  "dbc",
  "socketcan",
  "python-can",
  "cantools",
  "llm",
  "ai-agents",
  "simulator",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Emulators",
  "Topic :: System :: Hardware",
  "Typing :: Typed",
]

dependencies = [
  "python-can>=4.0",
  "can-isotp>=2.0",
  "udsoncan>=1.26",
  "cantools>=40.0",
  "mcp>=2.1.1,<3",
  "typer>=0.9.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "uvicorn>=0.22.0",
  "rich>=13.0.0"
]

[project.optional-dependencies]
# slcan (serial/USB CAN adapters such as CANable) needs pyserial.
serial = ["pyserial>=3.0"]
dev = ["pytest", "ruff", "mypy", "build", "twine"]

[project.urls]
Homepage = "https://github.com/farzadnadiri/peykan"
Repository = "https://github.com/farzadnadiri/peykan"
Issues = "https://github.com/farzadnadiri/peykan/issues"
Changelog = "https://github.com/farzadnadiri/peykan/blob/main/CHANGELOG.md"

[project.scripts]
peykan = "peykan.cli:app"
# Deprecated alias from when the project was called mcp-can.
mcp-can = "peykan.cli:legacy_main"

[tool.setuptools.dynamic]
version = { attr = "peykan.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"peykan" = ["py.typed", "data/*.dbc", "data/*.asc"]
"peykan.server" = ["templates/*.html"]
