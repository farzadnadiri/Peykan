services:
  server:
    build: ..
    container_name: peykan-server
    environment:
      - PEYKAN_CAN_INTERFACE=virtual
      - PEYKAN_CAN_CHANNEL=bus0
      - PEYKAN_MCP_HOST=0.0.0.0
      - PEYKAN_MCP_PORT=6278
    working_dir: /home/pi/peykan
    command: bash -lc "peykan server --port 6278"
    ports:
      - "6278:6278"
    healthcheck:
      test: ["CMD", "bash", "-lc", "python3 - <<PY\nimport socket,sys\ns=socket.socket()\n\ntry:\n s.connect((\"127.0.0.1\", 6278))\n s.close()\n sys.exit(0)\nexcept Exception:\n sys.exit(1)\nPY"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  simulator:
    build: ..
    container_name: peykan-sim
    environment:
      - PEYKAN_CAN_INTERFACE=virtual
      - PEYKAN_CAN_CHANNEL=bus0
      - PEYKAN_MCP_HOST=0.0.0.0
    working_dir: /home/pi/peykan
    command: bash -lc "peykan simulate"

